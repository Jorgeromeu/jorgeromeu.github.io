baseURL = 'https://jorgeromeu.github.io/'
languageCode = 'en-us'
title = 'Jorge Romeu Huidobro'
theme = ["xmin"]
enableInlineShortcodes = true
enableRobotsTXT = true
buildDrafts = false
buildFuture = false
buildExpired = false
enableEmoji = true
pygmentsUseClasses = true
mainsections = ["posts", "papermod"]

[params]
env = "production"
author = "Jorge Romeu Huidobro"
defaultTheme = "auto"
images = ["images/papermod-cover.png"]

[params.assets]
  css = ["css/extended/custom.scss"]

[caches]
  [caches.images]
    dir = ':cacheDir/images'

[minify]
disableXML = true

[pagination]
disableAliases = false
pagerSize = 5

[outputs]
home = ["HTML", "RSS", "JSON"]
section = ["HTML"]
page = ["HTML"]

[markup]
[markup.goldmark.renderer]
unsafe = true

[markup.highlight]
noClasses = false
anchorLineNos = true
codeFences = true
guessSyntax = true
style = "monokai"

[services.instagram]
disableInlineCSS = true

[services.x]
disableInlineCSS = true
