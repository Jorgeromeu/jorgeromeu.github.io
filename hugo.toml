baseURL = 'https://example.org/'
languageCode = 'en-us'
title = 'Jorge Romeu Huidobro'
theme = ["PaperMod"]

enableInlineShortcodes = true
enableRobotsTXT = true
buildDrafts = false
buildFuture = false
buildExpired = false
enableEmoji = true
pygmentsUseClasses = true
mainsections = ["posts", "papermod"]

[params]
env = "production"                                                              # enables google analytics, opengraph, twitter-cards, schema
description = "Theme PaperMod - https://github.com/adityatelange/hugo-PaperMod"
author = "Theme PaperMod"
defaultTheme = "auto"
ShowShareButtons = true
ShowReadingTime = true
displayFullLangName = true
ShowPostNavLinks = true
ShowBreadCrumbs = true
ShowCodeCopyButtons = true
ShowRssButtonInSectionTermList = true
ShowAllPagesInArchive = true
ShowPageNums = true
ShowToc = true
images = ["images/papermod-cover.png"]

[caches]
  [caches.images]
    dir = ':cacheDir/images'

[minify]
disableXML = true

[pagination]
disableAliases = false
pagerSize = 5

[languages]

[languages.en]
languageName = "English"
weight = 1
[[languages.en.menu.main]]
name = "Projects"
url = "projects"
weight = 5

[outputs]
home = ["HTML", "RSS", "JSON"]

[markup]
[markup.goldmark.renderer]
unsafe = true

[markup.highlight]
noClasses = false
anchorLineNos = true
codeFences = true
guessSyntax = true
# lineNos = true
style = "monokai"

[services.instagram]
disableInlineCSS = true

[services.x]
disableInlineCSS = true
